<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招新网站</title>


    <style>



        .error-xingmingshurukuang{                              
            display: none;
            color: #b11f61;
            font-size: 12px;
            /* margin-top: 5px; */

        }


        #error-fuxuanshurukuang{
            display: none;
            color: #b11f61;
            font-size: 12px;
            /* margin-top: 5px; */
        }


        #tijiaoanniu,#chongzhianniu{
            width: 150px;
            height: 50px;
            border: none;
            background-color: #ffffff;
            /* background: linear-gradient(135deg,#fbfbfc,#fefdfe); */
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
            transition: all 0.25s ease-out;
            
        }
        
        #tijiaoanniu:hover{
            /* 这是按钮的悬浮状态 */
            transform: translateY(-5px);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
            
        }
        #tijiaoanniu:active{
            background: linear-gradient( 135deg,#f393b9,#b11f61);
            transform: translateY(3px)
            scale(0.8);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
        }



        #chongzhianniu:hover{
            /* 这是按钮的悬浮状态 */
            transform: translateY(-5px);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
            
        }
        #chongzhianniu:active{
            background: linear-gradient( 135deg,#f393b9,#b11f61);
            transform: translateY(3px)
            scale(0.8);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
        }

        
        .h1{
            font-size:50px;
            
        }
        #tijiaoanniu,
        #chongzhianniu{
            font-size: 20px;
           
        }




        body{
            height: 100vh;
            margin: 0;
            padding: 0;
            display:flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient( 135deg,#d4b5c2,#d36e9b);
        }
        * {
             box-sizing: border-box;
        }

        #xinshengbaomingbiao{
            width: 450px;
            min-height: 700px;
            padding: 50px;
            background: linear-gradient(135deg,#a8c4eb,#3767e1);
            border-radius: 50px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.8);
        }

        #xinshengbaomingbiao .h1{
            margin: 0 0 32px 0;
            text-align: center;
        }

        #baomingbiao > div,
        #baomingbiao > select{
            margin-bottom: 28px;
        }

        #baomingbiao label{
            display: block;
            font-size: 15px;
            font-weight: 666;
            color: #ffffff;
            margin-bottom: 8px;
        }

        #xingmingshurukuang,
        #zhaoxinfangxiang,
        #ziwojieshaoshurukuang{
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            color: #333333;
            border: none;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.9);
            outline: none;
        }

        #ziwojieshaoshurukuang{
            height: 110px;
            resize: vertical;
        }

        .fuxuanshuru{
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fuxuanshuru label{
            display: inline;
            margin-bottom: 0;
            font-weight: normal;
        }

        #fuxuanshurukuang{
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        #botton{
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 8px;
        }

        #xingmingshurukuang:focus,
        #zhaoxinfangxiang:focus,
        #ziwojieshaoshurukuang:focus {
            border: 2px solid #b11f61;  
        }

     </style>





</head>


<body>


 

    <div id="xinshengbaomingbiao">
        <p class="h1">
            新生报名表
        </p>
        <form action="" id="baomingbiao" novalidate="novalidate">
            
            
            
            <div class="xingmingshuru">
                <label for="xingmingshurukuang">姓名
                    <span class="xinghao1">*</span><!-- 这里是方便改变*的颜色 -->
                </label>
                <input type="text" name="xingming" id="xingmingshurukuang" placeholder="请输入你的名字">
                <div class="error-xingmingshurukuang">姓名不能为空</div>       
            </div>



            <select name="zhaoxinfangxiang" id="zhaoxinfangxiang">
                <option value="baomingfangxiang" disabled selected>请选择报名方向</option>
                <option value="qianduan">前端</option>
                <option value="houduan">后端</option>
                <option value="sheji">设计</option>
            </select>



            <div class="ziwojieshaoshuru">
                <label for="ziwojieshao">自我介绍
                    <span id="xinghao2">*</span><!-- 这里是方便改变*的颜色 -->
                </label>
                <textarea name="ziwojieshaoshurukuang" id="ziwojieshaoshurukuang" placeholder="自我介绍一下吧(限100字符以内)"></textarea>
                <span id="zishu">0/100</span>
            </div>



            <div class="fuxuanshuru">
                <input type="checkbox" name="fuxuanshurukuang" id="fuxuanshurukuang">
                <label for="fuxuanshurukuang">我已详细阅读并同意报名须知
                    <span class="xinghao3">*</span>
                </label>
                <div id="error-fuxuanshurukuang">报名前请先阅读报名须知并勾选同意</div>
            </div>



            <div id="botton">
                <button type="submit" id="tijiaoanniu">提交报名</button>
                <button type="reset" id="chongzhianniu">重置</button>
            </div>
        </form>
    </div>

    <script>
        const baomingbiao = document.getElementById('baomingbiao')
        const xingming = document.getElementById('xingmingshurukuang')
        const zhaoxinfangxiang = document.getElementById('zhaoxinfangxiang')
        const ziwojieshao = document.getElementById('ziwojieshaoshurukuang')
        const fuxuanshurukuang = document.getElementById('fuxuanshurukuang')

        function clearErrors(){
            document.querySelectorAll('.error-xingmingshurukuang, #error-fuxuanshurukuang')
            .forEach(function(t1){
                t1.style.display = 'none';
            });
        }

        let isSubmitting = false   // 提交状态标记，防重复提交

        baomingbiao.addEventListener('submit', function (t) {
            t.preventDefault()

            if (isSubmitting) return         

            clearErrors()             

            let firstError = null

            if (xingming.value.trim() === '') {
                document.querySelector('.error-xingmingshurukuang').style.display = 'block'
                if (!firstError) firstError = xingming
            }

            if (zhaoxinfangxiang.value === 'baomingfangxiang') {  
                if (!firstError) firstError = zhaoxinfangxiang
            }

            if (ziwojieshao.value.trim() === '' || ziwojieshao.value.length > 100) {
                if (!firstError) firstError = ziwojieshao
            }

            if (!fuxuanshurukuang.checked) {
                document.getElementById('error-fuxuanshurukuang').style.display = 'block'
                if (!firstError) firstError = fuxuanshurukuang
            }

           
            if (firstError) {
                firstError.focus()
                return                     
            }

           
            const anniu = document.getElementById('tijiaoanniu')
            isSubmitting = true
            anniu.disabled = true          
            anniu.textContent = '正在提交...'
            console.log('正在提交...')

            

            setTimeout(function () {
                anniu.disabled = false
                anniu.textContent = '提交报名'
                isSubmitting = false
                alert('报名成功~')    
            }, 1000)
        })


        const xianshizishu = document.getElementById('zishu')
        const zishu = document.getElementById('ziwojieshaoshurukuang')
        zishu.addEventListener('input',()=>{xianshizishu.textContent=zishu.value.length+'/100';})



    </script>
    
</body>
</html>
