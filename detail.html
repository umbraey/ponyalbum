<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pony Character Detail</title>
    <style>
        @property --card-grad-start {
            syntax: '<color>';
            inherits: true;
            initial-value: #98989a;
        }
        @property --card-grad-end {
            syntax: '<color>';
            inherits: true;
            initial-value: #190372;
        }

        :root {
            --bg-body: rgb(5, 41, 53);
            --bg-navbar: rgba(0, 8, 10, 0.82);
            --card-grad-start: #98989a;
            --card-grad-end: #190372;
            --card-shadow: rgba(0, 0, 0, 0.8);
            --accent: rgb(43, 223, 223);
            --hover-glow: rgba(34, 144, 159, 0.5);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.92);
            --label-bg: rgba(255, 255, 255, 0.16);
            --label-text: #fff;
            --panel-bg: rgba(255, 255, 255, 0.12);
            --panel-bg-hover: rgba(255, 255, 255, 0.22);
            --border-default: rgba(255, 255, 255, 0.55);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            background-image: linear-gradient(rgba(5, 41, 53, 0.72), rgba(5, 41, 53, 0.72)), url("background_day.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 2s ease-in;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 16px 32px;
            background-color: var(--bg-navbar);
            backdrop-filter: blur(6px);
            transition: background-color 2s ease;
        }

        .back {
            display: inline-block;
            padding: 10px 24px;
            border: 2px solid var(--border-default);
            border-radius: 30px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            transition: all 0.25s ease-out, color 2s ease, border-color 2s ease;
        }

        .back:hover {
            background: var(--panel-bg-hover);
            border-color: var(--accent);
        }

        .switch-group {
            display: flex;
            gap: 10px;
        }

        .switch-group button {
            padding: 10px 28px;
            border: 2px solid var(--border-default);
            border-radius: 30px;
            background-color: var(--panel-bg);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease-out, color 2s ease, border-color 2s ease, background-color 2s ease;
        }

        .switch-group button:hover {
            background-color: var(--panel-bg-hover);
            border-color: var(--accent);
        }

        .switch-group button.active {
            background: linear-gradient(135deg, #2a9d9d, #0e4b6b);
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--hover-glow);
            font-weight: bold;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 48px 24px 64px;
        }

        .detail-card {
            display: flex;
            align-items: flex-start;
            gap: 34px;
            width: min(980px, 94vw);
            background: linear-gradient(135deg, var(--card-grad-start), var(--card-grad-end));
            border-radius: 40px;
            padding: 36px 40px 42px;
            box-shadow: 0 10px 50px var(--card-shadow), 0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: background 2s ease, box-shadow 2s ease;
        }

        .portrait {
            flex: none;
            width: 250px;
            height: 250px;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.25s ease;
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .info h1 {
            margin: 0 0 18px;
            color: var(--text-primary);
            font-family: 'Segoe Script', 'Comic Sans MS', cursive;
            font-size: 30px;
            font-style: italic;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            transition: color 2s ease;
        }

        .fade-swap {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        body.day {
            --bg-body: rgba(255, 255, 255, 0.75);
            --bg-navbar: rgba(255, 255, 255, 0.82);

            --card-grad-start: #ffffff;
            --card-grad-end: #ff9d45;
            --card-shadow: rgba(120, 70, 20, 0.25);

            --accent: rgb(255, 140, 66);
            --hover-glow: rgba(255, 150, 80, 0.45);
            --border-default: #f0b27a;

            --text-primary: #333;
            --text-secondary: rgba(60, 45, 25, 0.92);
            --label-bg: rgba(255, 140, 66, 0.18);
            --label-text: #7a4a12;

            --panel-bg: rgba(255, 255, 255, 0.5);
            --panel-bg-hover: rgba(255, 255, 255, 0.8);

            background-image: url("background_day.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* 白天模式结束 */

     
    </style>
</head>
<body>

            ponyIntro = '出生于小马国首都坎特洛特，是闪耀盔甲的妹妹，幼年便展现出惊人的魔法天赋。 小马国友谊公主，曾担任小马国统治者、坎特洛特图书馆管理员与塞拉斯蒂娅公主的私人学生。 勤奋好学、严谨认真，略带书卷气的焦虑与完美主义，但对待朋友极其忠诚可靠。 阅读魔法典籍、钻研新魔法、列待办清单、和朋友一起举办读书会。';
            humanImg = 'IMGP_3028389.._cutout.png';
            humanIntro = '出生在坎特洛特市的普通家庭，哥哥闪耀盔甲是水晶预科学校的学长。 坎特洛特高中优秀学生，学校图书管理员助理，后成为朋友们公认的“学霸军师”。 聪明认真、责任心强，有点书呆气，偶尔过度紧张，但总能在关键时刻挺身而出。 学习与科学实验、写读书笔记、做实验记录、周末泡图书馆。';
            break;
    }

    let form = 'pony';
    if (id.includes('*')) {
        form = 'human';
    }

    function show() {
        if (form === 'human') {
            document.getElementById('char-img').src = humanImg;
            document.getElementById('char-name').textContent = name;
            document.getElementById('char-intro').innerHTML = '<p>' + humanIntro + '</p>';
        } else {
            document.getElementById('char-img').src = ponyImg;
            document.getElementById('char-name').textContent = name;
            document.getElementById('char-intro').innerHTML = '<p>' + ponyIntro + '</p>';
        }
    }
 
    // 切换按钮
    function setForm(f) {
        form = f;
        show();

        document.getElementById('btn-pony').classList.remove('active');
        document.getElementById('btn-human').classList.remove('active');
        document.getElementById('btn-' + f).classList.add('active');
    }

    show();
</script>
